# 在推送 v* 标签或手动触发时构建 release 二进制并上传到 GitHub Release。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    name: Gate
    runs-on: windows-latest
    defaults:
      run:
        working-directory: my-workbench
    steps:
      - name: Checkout workbench
        uses: actions/checkout@v4
        with:
          path: my-workbench

      - name: Checkout gpui-kit
        uses: actions/checkout@v4
        with:
          repository: longbridge/gpui-kit
          path: gpui-kit

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format, clippy, test
        run: |
          cargo fmt --check
          cargo clippy --workspace -- -D warnings
          cargo test --workspace

  publish:
    name: Build Windows
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: my-workbench
    steps:
      - name: Checkout workbench
        uses: actions/checkout@v4
        with:
          path: my-workbench

      - name: Checkout gpui-kit
        uses: actions/checkout@v4
        with:
          repository: longbridge/gpui-kit
          path: gpui-kit

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build -p wb-app --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-workbench-windows
          path: my-workbench/target/release/my-workbench.exe

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: my-workbench/target/release/my-workbench.exe
