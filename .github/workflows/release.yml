# 在推送 v* 标签或手动触发时构建 release 二进制并上传到 GitHub Release。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    name: Gate
    runs-on: windows-latest
    defaults:
      run:
        working-directory: my-workbench
    steps:
      - name: Checkout workbench
        uses: actions/checkout@v5
        with:
          path: my-workbench

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format, clippy, test
        run: |
          cargo fmt --check
          cargo clippy --workspace -- -D warnings
          cargo test --workspace

  publish:
    name: Build Windows
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: my-workbench
    steps:
      - name: Checkout workbench
        uses: actions/checkout@v5
        with:
          path: my-workbench

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build -p wb-app --release

      - name: Package themes next to the executable
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "my-workbench/dist/my-workbench"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/my-workbench.exe" $stage
          # 守护进程与 MCP 启动壳必须和主程序同目录，否则聊天/右栏无法工作。
          Copy-Item "target/release/wb-gluon.exe" $stage
          Copy-Item "target/release/hadron-forge-mcp.exe" $stage
          Copy-Item -Recurse "themes" (Join-Path $stage "themes")
          $zip = Join-Path $env:GITHUB_WORKSPACE "my-workbench/dist/my-workbench-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-workbench-windows
          path: my-workbench/dist/my-workbench-windows.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: my-workbench/dist/my-workbench-windows.zip
