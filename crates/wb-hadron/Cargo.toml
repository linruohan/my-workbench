[package]
name = "wb-hadron"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
description = "Hadron chamber 的运行时与界面（移植到 gpui-kit）"

[dependencies]
# Hadron 后端：事件场、权限门禁、按哈希编辑与 MCP、守护进程。
hadron-lattice = { path = "../hadron-lattice" }
hadron-gatekeeper = { path = "../hadron-gatekeeper" }
hadron-forge = { path = "../hadron-forge" }
hadron-forge-mcp = { path = "../hadron-forge-mcp" }
hadron-gluon = { path = "../hadron-gluon" }

# 界面层：工作台统一使用 gpui-kit（内含 GPUI 与 gpui-component）。
gpui-kit = { workspace = true }
rust-embed = "8.12"

anyhow = "1"
chrono = "0.4.45"
emojis = "0.9"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"
rusqlite = { version = "0.31", features = ["bundled"] }

[features]
default = ["gui"]
# 界面层（GPUI + gpui-component 移植版）。
gui = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
] }
