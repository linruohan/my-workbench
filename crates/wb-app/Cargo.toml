[package]
name = "wb-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Personal workbench desktop UI (GPUI + gpui-kit)"

[[bin]]
name = "my-workbench"
path = "src/main.rs"

# 与工作台同目录发布的守护进程与 MCP 启动壳：聊天/右栏依赖它们。
[[bin]]
name = "wb-gluon"
path = "src/bin/wb-gluon.rs"

[[bin]]
name = "hadron-forge-mcp"
path = "src/bin/hadron-forge-mcp.rs"

[dependencies]
wb-domain.workspace = true
wb-store.workspace = true
wb-host.workspace = true
wb-agent.workspace = true
# Hadron 聊天区与右侧栏（从 hadron-chamber 移植）。
wb-hadron = { path = "../wb-hadron" }
# 与工作台同目录发布的守护进程 / MCP 启动壳（src/bin 中引用）。
hadron-gluon = { path = "../hadron-gluon" }
hadron-forge-mcp = { path = "../hadron-forge-mcp" }
gpui-kit.workspace = true
reqwest_client.workspace = true
anyhow.workspace = true
chrono.workspace = true
jiff = "1.0"
env_logger.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
tray-icon.workspace = true
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
resvg = "0.46"
