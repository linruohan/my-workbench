[[permission]]
identifier = "allow-kb-fs"
description = "Read and write folders the user imported into the knowledge base, and open external links."
commands.allow = [
  "kb_pick_directory",
  "kb_list_dir",
  "kb_read_text",
  "kb_write_text",
  "kb_read_base64",
  "kb_write_base64",
  "kb_exists",
  "kb_mkdir",
  "kb_rename",
  "kb_reveal_in_explorer",
  "open_external",
]
