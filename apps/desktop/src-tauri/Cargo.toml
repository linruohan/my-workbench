[package]
name = "app"
version = "0.1.4"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["unstable"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
base64 = "0.21"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "charset"] }
zip = "2.2"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }
url = "2"
