[workspace]
resolver = "2"
members = [
    "crates/wb-domain",
    "crates/wb-store",
    "crates/wb-host",
    "crates/wb-agent",
    "crates/wb-app",
    "crates/wb-asr",
    # 从 Hadron 同步过来的后端：事件场、权限门禁、按哈希编辑与 MCP、守护进程。
    "crates/hadron-lattice",
    "crates/hadron-gatekeeper",
    "crates/hadron-forge",
    "crates/hadron-forge-mcp",
    "crates/hadron-gluon",
    # Hadron 聊天区与右侧栏的移植层。
    "crates/wb-hadron",
]
default-members = ["crates/wb-app"]

[workspace.package]
version = "0.1.16"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
wb-domain = { path = "crates/wb-domain" }
wb-store = { path = "crates/wb-store" }
wb-host = { path = "crates/wb-host" }
wb-agent = { path = "crates/wb-agent" }

# 与 Hadron 的 gpui-component `tree-sitter-languages` 相同：Markdown 围栏按语法上色。
# 引擎仍是 gpui-kit 自带的 Zed GPUI 快照（gpui-pre），界面控件不用手写。
gpui-kit = { git = "https://github.com/linruohan/gpui-kit.git", features = ["tree-sitter-languages"] }
gpui-webview = { git = "https://github.com/linruohan/gpui-kit.git" }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.14" }
wry = "0.57.4"

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "6"
log = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "charset", "stream", "json", "blocking"] }
rfd = "0.15"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
tray-icon = "0.19"
base64 = "0.22"
font-kit = "0.14"
url = "2"
walkdir = "2"
env_logger = "0.11"
portable-pty = "0.8"
cpal = "0.15"
hound = "3.5"
# paddle-ocr-rs 0.6.1 与 ort >= rc.11 API 不兼容；用 load-dynamic 避开 copy-dylibs 在 Windows 上的路径坑
# sherpa-onnx 官方 Windows 预编译为 MT CRT，与 clipper-sys(MD) 无法同链 → 语音走独立 crate wb-asr 子进程
paddle-ocr-rs = { version = "0.6.1", default-features = false, features = ["download-binaries"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "download-binaries", "load-dynamic"] }
sherpa-onnx = { version = "=2.0.2", default-features = false, features = ["shared"] }

# GPUI 的排版、文本整形和滚动几乎都在依赖里。debug 下依赖保持 opt-level 0
# 时，输入和滚动会明显掉帧。对齐 Zed / Hadron：依赖优化到 2，本仓库 crate
# 用 1（仍可调试，热路径上的泛型也不会完全没优化）。
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
debug = "limited"

[profile.release]
strip = "symbols"
